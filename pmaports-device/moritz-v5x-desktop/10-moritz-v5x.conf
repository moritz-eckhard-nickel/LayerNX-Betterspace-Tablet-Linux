# Betterspace V5x: mtkfb (Panel nativ 800x1280), per Xorg auf Querformat 1280x800 gedreht
# (wie Android: ro.sf.hwrotation=270). Touch mtk-tpd liefert bereits Querformat-Koordinaten.
Section "ServerFlags"
	Option "AutoAddDevices" "false"
	Option "AutoAddGPU" "false"
	Option "BlankTime" "0"
	Option "StandbyTime" "0"
	Option "SuspendTime" "0"
	Option "OffTime" "0"
	Option "DontVTSwitch" "true"
EndSection

Section "Device"
	Identifier "mtkfb"
	Driver "fbdev"
	Option "fbdev" "/dev/fb0"
	Option "ShadowFB" "on"
	Option "Rotate" "CCW"
EndSection

Section "Monitor"
	Identifier "panel"
	Option "DPMS" "false"
EndSection

Section "Screen"
	Identifier "screen"
	Device "mtkfb"
	Monitor "panel"
	DefaultDepth 24
EndSection

# Touch: Querformat-Koordinaten X 0..1280, Y 0..800 (Typ-A-Multitouch, evdev)
Section "InputDevice"
	Identifier "touchscreen"
	Driver "evdev"
	Option "Device" "/dev/input/moritz-touch"
	Option "SwapAxes" "false"
	Option "InvertX" "false"
	Option "InvertY" "false"
	Option "Calibration" "0 1280 0 800"
EndSection

Section "InputDevice"
	Identifier "gesten"
	Driver "evdev"
	Option "Device" "/dev/input/moritz-gestures"
EndSection

Section "ServerLayout"
	Identifier "layout"
	Screen "screen"
	InputDevice "touchscreen" "CorePointer"
	InputDevice "gesten" "SendCoreEvents"
EndSection
