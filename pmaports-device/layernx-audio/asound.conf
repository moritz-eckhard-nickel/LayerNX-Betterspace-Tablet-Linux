# LayerNX-Tablet-Linux: alle ALSA-Programme gehen ueber PulseAudio
# (Hardware nimmt nur feste Raten; ausserdem kann so mehr als ein Programm aufnehmen).
# Direkt auf das Mikrofon (ohne PulseAudio, nur wenn layernx-pulse gestoppt ist): arecord -D hw:0,3 -r 48000 -c 2 -f S16_LE
pcm.!default { type pulse }
ctl.!default { type pulse }
